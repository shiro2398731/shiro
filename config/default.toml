[network]
pub_p1 = 5561
pub_p2 = 5562
pub_p3 = 5563
pub_p4 = 5560
# ack_rep = 5564 已废院（同步屏障于 2026-11-01 废除，见 CONTRACTS/00_overview.md §2）

# 生命周期参数已废除。
# 旧版 awake_duration_sec / sleep_duration_sec / ack_timeout_ms 是死量化：
# 相位不由时间决定，而由 L0 慢包络自己决定（ARCHITECTURE.md §3.5）。
# 如果将来需要"发育阶段"相关的参数，只能是 A/B 类，且在 config 里注明来源。

[expression]
mode = "template"
llm_model = "llama3.2:3b"
llm_host = "http://127.0.0.1:11434"
output_socket = "tcp://127.0.0.1:5560"

[L0]
# 以下属于 A 类（模型定义）。改它们等于换一个模型，不是调参。
n_neurons = 100         # 文献惯例：E/I 群体规模比约 5:1
p_conn = 0.15           # 随机连接密度
noise_sigma = 2.0       # 快层外部噪声幅度
seed = 42

[L0.pressure]
# 慢累积量的两个时间常数，单位：秒。A 类物理参数。
#
# tau_down > tau_up，即“涨得快、落得慢”。这是纯动力学的不对称性，
# 不是“清醒/睡眠”的比例。代码里不用后者那套词。
#
# 取 1 小时 / 2 小时，是把它压到一次运行里能看出变化的比例。
# 目前不在任何地方设阈值：累积到某个水平后发生什么，等 L4/L5 存在之后再定。
tau_up_s = 3600.0
tau_down_s = 7200.0
